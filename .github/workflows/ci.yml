name: CI

# 目标：把 README 里"五个平台都编过了、79 个用例全绿"这类结论变成每次提交都自动验证的事实。
#
# 设计取舍：
#   * 不用 CMakePresets —— 预设里的工具链路径是本机绝对路径，CI 上不存在。
#     CI 直接给 -D 参数，这也顺便验证了"不依赖预设也能构建"。
#   * resources/*.zip 不进 git，所以每个 job 先跑 scripts/fetch-deps.sh。
#     ONNX Runtime / OpenCV / ncnn 的预编译包体积大且按平台区分，CI 一律不装，
#     infer 组件自动退化成 stub 后端（这正是它有 stub 的用途）。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 依赖下载很慢，统一由 job 自己的 steps 处理；这里只放公共开关
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # ---------------------------------------------------------------- Linux 默认组合
  linux:
    name: Linux / gcc / 全组件
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: 缓存三方库
        uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - name: 补齐依赖压缩包
        run: bash scripts/fetch-deps.sh
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ci
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      # 嵌入验证：把本库当源码库 add_subdirectory 进一个独立工程，构建并运行
      - name: 消费方工程（add_subdirectory 嵌入）
        run: |
          cmake -S examples/consumer_app -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer
          ./build/consumer/consumer_app

  # ---------------------------------------------------------------- UBSan
  linux-ubsan:
    name: Linux / gcc / UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      # trap 模式：UB 编译成 trap 指令，不依赖 libubsan。
      # 和本地 win-ubsan 预设用的是同一套选项，行为一致。
      - name: Configure (UBSan)
        run: |
          cmake -S . -B build/ci-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMYLIB_SANITIZE=undefined
      - name: Build
        run: cmake --build build/ci-ubsan
      - name: Test
        run: ctest --test-dir build/ci-ubsan --output-on-failure

  # ---------------------------------------------------------------- ASan
  linux-asan:
    name: Linux / gcc / ASan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      # 用 Debug 而不是 RelWithDebInfo：RelWithDebInfo 会定义 NDEBUG，
      # 断言与前置条件检查全被编译掉，ASan 就只剩下"内存错误"一半的价值。
      # 独立脚本 scripts/run-tests-asan-wsl.sh 一直用的是 Debug，两者现在对齐了。
      - name: Configure (ASan + 泄漏检测)
        run: |
          cmake -S . -B build/ci-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMYLIB_SANITIZE=address
      - name: Build
        run: cmake --build build/ci-asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ctest --test-dir build/ci-asan --output-on-failure

  # ---------------------------------------------------------------- 最小配置（组件裁剪矩阵）
  linux-minimal:
    name: Linux / 最小配置（只留 core+log）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      # 验证"组件可独立开关"不是口号：关掉 json/math/infer 之后，
      # 测试列表会自动缩减，示例里的相关 target 会自动消失而不是编不过。
      - name: Configure (minimal)
        run: |
          cmake -S . -B build/ci-min -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMYLIB_ENABLE_JSON=OFF \
            -DMYLIB_ENABLE_MATH=OFF \
            -DMYLIB_ENABLE_INFER=OFF
      - name: Build
        run: cmake --build build/ci-min
      - name: Test
        run: ctest --test-dir build/ci-min --output-on-failure
      - name: 确认裁剪真的生效
        run: |
          set -e
          test -f  build/ci-min/src/libmy_cpp_libs_log.a
          # image（stb 解码）不依赖 infer / json / math，这一条就是在验证 P5：
          # 以前 cv 无条件链 infer，-DMYLIB_ENABLE_INFER=OFF 时整个 configure 会失败
          test -f  build/ci-min/src/libmy_cpp_libs_image.a
          test ! -f build/ci-min/src/libmy_cpp_libs_json.a
          test ! -f build/ci-min/src/libmy_cpp_libs_math.a
          test ! -f build/ci-min/src/libmy_cpp_libs_infer.a

  # ---------------------------------------------------------------- 无异常构建
  # 板端常以 -fno-exceptions 交付，但这条承诺过去只是文档里的一句话：
  # 全仓一个构建选项都没有，而 json/infer 里到处是 try/catch，真开就编不过。
  # 现在把承诺收紧成"core + math 可 -fno-exceptions"，并由这个 job 守住：
  #   1) 子集能编、能跑测试；
  #   2) 编译器命令行里真的出现了 -fno-exceptions；
  #   3) 和 json 同开时**必须** configure 失败（fail-closed，不允许静默降级）。
  linux-noexceptions:
    name: Linux / -fno-exceptions（core+math+dsp+net+io+time）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      # 子集是 core + math + dsp + net + io + time（0.1.2 起 io/time 也能无异常编译）。
      # THREAD 必须关：std::thread 构造失败只能靠 std::system_error 上报，
      # 0.1.2 起它已经进了 fail-closed 名单，漏了这行 configure 会直接 FATAL_ERROR。
      - name: Configure（只留 core + math + dsp + net + io + time）
        run: |
          cmake -S . -B build/ci-noex -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMYLIB_NO_EXCEPTIONS=ON \
            -DMYLIB_ENABLE_LOG=OFF \
            -DMYLIB_ENABLE_JSON=OFF \
            -DMYLIB_ENABLE_INFER=OFF \
            -DMYLIB_ENABLE_IMAGE=OFF \
            -DMYLIB_ENABLE_CV=OFF \
            -DMYLIB_ENABLE_HTTP=OFF \
            -DMYLIB_ENABLE_THREAD=OFF
      - name: 确认 -fno-exceptions 真的进了编译命令行
        run: |
          set -e
          grep -q -- "-fno-exceptions" build/ci-noex/build.ninja
      - name: Build
        run: cmake --build build/ci-noex
      - name: Test
        run: ctest --test-dir build/ci-noex --output-on-failure
      - name: 反向校验（开 json 时必须 configure 失败）
        run: |
          set -e
          if cmake -S . -B build/ci-noex-bad -G Ninja -DMYLIB_NO_EXCEPTIONS=ON > /tmp/noex-bad.log 2>&1; then
            echo "::error::MYLIB_NO_EXCEPTIONS=ON 与默认开启的 json/infer 同开时，configure 应当失败"
            cat /tmp/noex-bad.log
            exit 1
          fi
          grep -q "mylib-noex-conflict" /tmp/noex-bad.log   # CMake 会折行，用短标记

  # ---------------------------------------------------------------- 交叉编译（只验证能编能链）
  cross:
    name: 交叉编译 ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            toolchain: cmake/toolchains/linux-armv7-cross.cmake
          - target: aarch64
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            toolchain: cmake/toolchains/linux-aarch64-cross.cmake
    steps:
      - uses: actions/checkout@v4
      - name: 安装交叉工具链
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      - name: Configure
        run: |
          cmake -S . -B build/ci-${{ matrix.target }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}
      - name: Build
        run: cmake --build build/ci-${{ matrix.target }}
      - name: 校验产物架构
        run: |
          set -e
          f=$(ls build/ci-${{ matrix.target }}/bin/mylib_tests)
          file "$f"

  # ---------------------------------------------------------------- Windows / MSVC
  windows-msvc:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 没有这一步，configure 会在 "[deps] Eigen 头文件缺失" 直接 FATAL_ERROR：
      # resources/*.zip 不进 git，失败的根源不是编译器而是缺包。
      - name: 缓存三方库
        uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-windows-${{ hashFiles('scripts/fetch-deps.ps1') }}
          restore-keys: deps-windows-
      - name: 补齐依赖压缩包
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Configure
        run: >
          cmake -S . -B build/ci -A x64
          -DMYLIB_ENABLE_CV=OFF
          -DMYLIB_ENABLE_NCNN=OFF
      - name: Build
        run: cmake --build build/ci --config Release
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      # 嵌入验证（Windows 侧）：独立工程 add_subdirectory 后构建并运行
      - name: 消费方工程（add_subdirectory 嵌入）
        run: |
          cmake -S examples/consumer_app -B build/consumer -A x64
          cmake --build build/consumer --config Release
          ./build/consumer/Release/consumer_app.exe

  # ---------------------------------------------------------------- Windows / MinGW + UBSan
  windows-mingw:
    name: Windows / MinGW + UBSan
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: 缓存三方库
        uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-windows-${{ hashFiles('scripts/fetch-deps.ps1') }}
          restore-keys: deps-windows-
      # msys2 job 的默认 shell 是 msys2，而 fetch 脚本两个版本都有；
      # 这里显式用 pwsh 跑 .ps1，避免依赖 UCRT64 里有没有 curl/unzip。
      - name: 补齐依赖压缩包
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Configure (UBSan, trap 模式)
        run: |
          cmake -S . -B build/ci-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMYLIB_SANITIZE=undefined \
            -DMYLIB_ENABLE_CV=OFF \
            -DMYLIB_ENABLE_NCNN=OFF
      - name: Build
        run: cmake --build build/ci-ubsan
      - name: Test
        run: ctest --test-dir build/ci-ubsan --output-on-failure

  # ---------------------------------------------------------------- Debug（断言/契约全开）
  # 为什么必须单独有一个 Debug job：Release / RelWithDebInfo / MinSizeRel 都会定义
  # NDEBUG，于是 Eigen 的断言、STL 的调试检查、我们自己写的前置条件**一次都不执行**。
  # 历史上那个"least_squares 把矩阵喂给 Eigen::Ref<VecXd>"的缺陷就是这样：
  # Release 下靠 NDEBUG 侥幸正确，文档承诺的 ASan(Debug) 路径必崩，而 CI 全是 Release 家族。
  linux-debug:
    name: Linux / gcc / Debug（断言全开）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      - name: Configure (Debug)
        run: |
          cmake -S . -B build/ci-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/ci-debug
      - name: Test
        run: ctest --test-dir build/ci-debug --output-on-failure

  # ---------------------------------------------------------------- SDK 安装 + 外部消费
  # 全仓唯一验证 `find_package(my_cpp_libs CONFIG)` 这条链路的 job。
  # 没有它，"dist/ 的 SDK 拿到目录就能用"只是一句话：install 规则改坏了、
  # Config 里漏了编译特性/依赖，都不会有任何人发现。
  linux-sdk-consumer:
    name: Linux / SDK install + find_package 消费
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      - name: Configure (只装库，不建示例/测试)
        run: |
          cmake -S . -B build/ci-sdk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMYLIB_BUILD_EXAMPLES=OFF \
            -DMYLIB_BUILD_TESTS=OFF \
            -DMYLIB_BUILD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdk"
      - name: Build
        run: cmake --build build/ci-sdk
      - name: Install
        run: cmake --install build/ci-sdk
      - name: 校验安装树
        run: |
          set -e
          test -f sdk/include/my_cpp_libs/core/status.hpp
          test -f sdk/lib/cmake/my_cpp_libs/my_cpp_libsConfig.cmake
          # SDK 必须把 C++17 要求传给消费方，否则默认 C++14 的下游工程编不过
          grep -q "cxx_std_17" sdk/lib/cmake/my_cpp_libs/my_cpp_libsConfig.cmake
      - name: 外部工程用 find_package 构建
        run: |
          cmake -S tests/sdk_consumer -B build/consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/sdk"
          cmake --build build/consumer
      - name: 运行外部工程（真实链接 + 真实跑）
        run: ./build/consumer/sdk_consumer

  # ---------------------------------------------------------------- TSan（数据竞争）
  # log 的全局状态、infer 的后端注册表、http 的线程管理都是"并发写在文档里、
  # 但一个并发用例都没有"。TSan 是唯一能在 CI 上守住这类问题的工具。
  linux-tsan:
    name: Linux / gcc / TSan（数据竞争）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      # Ubuntu 24.04 的 vm.mmap_rnd_bits=32 会让 TSan 报 "unexpected memory mapping"，
      # 必须降到 28，否则这个 job 从第一秒起就是红的（与代码无关）。
      - name: 放宽 ASLR（TSan 要求）
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure (TSan)
        run: |
          cmake -S . -B build/ci-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMYLIB_SANITIZE=thread
      - name: Build
        run: cmake --build build/ci-tsan
      - name: Test
        env:
          # tests/tsan.supp 只抑制 spdlog 异步销毁路径这一类已知安全模式（见文件内的说明），
          # 我们自己的代码不抑制任何东西。
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/tsan.supp
        run: ctest --test-dir build/ci-tsan --output-on-failure

  # ---------------------------------------------------------------- QEMU 真跑 ARM 单测
  # 上面的 cross job 只验证"能编能链"；这个 job 用 qemu-user 把 armv7 / aarch64 的
  # 单测**真的跑一遍**（2026-11-18 补：在此之前"5 平台"里的 ARM 只到编译链接）。
  #
  # 三个做法要点（都是踩过的坑）：
  #   1. 产物链接成**全静态**：于是 qemu-*-static 直接执行，不需要 -L <sysroot>。
  #      本地已用 PetaLinux / ARM GNU 两套工具链验证 readelf -d 输出 "no dynamic section"。
  #   2. 不注册 binfmt（直接把 qemu-user-static 当解释器用），避免 update-binfmts 的权限问题。
  #   3. 整包一次跑，不是逐用例 261 个进程 —— qemu 下进程启动开销比测试本身还大。
  qemu-test:
    name: QEMU ${{ matrix.target }}（ARM 单测真跑）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            toolchain: cmake/toolchains/linux-armv7-cross.cmake
            qemu: qemu-arm-static
          - target: aarch64
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            toolchain: cmake/toolchains/linux-aarch64-cross.cmake
            qemu: qemu-aarch64-static
    steps:
      - uses: actions/checkout@v4
      - name: 安装交叉工具链 + qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qemu-user-static ${{ matrix.packages }}
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      - name: Configure（静态链接，qemu 不需要 sysroot）
        run: |
          cmake -S . -B build/qemu-${{ matrix.target }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
            -DMYLIB_BUILD_EXAMPLES=OFF \
            -DMYLIB_BUILD_TOOLS=OFF \
            -DMYLIB_ENABLE_ONNXRUNTIME=OFF \
            -DMYLIB_ENABLE_CV=OFF \
            -DMYLIB_ENABLE_NCNN=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-static
      - name: Build
        run: cmake --build build/qemu-${{ matrix.target }}
      - name: 确认产物真的是静态 ELF
        run: |
          set -euo pipefail
          f=build/qemu-${{ matrix.target }}/bin/mylib_tests
          file "$f"
          if readelf -d "$f" | grep -q NEEDED; then
            echo "::error::产物是动态链接的，qemu 下会缺 .so；检查 -static 是否生效"
            readelf -d "$f"
            exit 1
          fi
          readelf -h "$f" | grep -E 'Machine|Type'
      - name: 在 qemu 下跑全部单测
        run: |
          set -euo pipefail
          f=build/qemu-${{ matrix.target }}/bin/mylib_tests
          chmod +x "$f"
          timeout 2400 ${{ matrix.qemu }} "$f" | tee /tmp/qemu-tests.log
          echo "---- 汇总 ----"
          grep -E '^结果:' /tmp/qemu-tests.log
          # [SKIP] 是允许的（没有 ORT 后端时 ml 的对拍会跳过）；失败用例必须是 0
          if grep -qE '^结果:.*[1-9][0-9]* 个失败用例' /tmp/qemu-tests.log; then
            echo "::error::qemu 下有失败用例（见上面的 [FAIL] 行）"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-${{ matrix.target }}-log
          path: /tmp/qemu-tests.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------- 打包（CPack，可复现 SDK）
  # 0.1.3 起 SDK 包由 CPack 生成，但一直是**本机手工跑**（scripts/package-all.ps1）——
  # 也就是说"四个包"依赖这台机器恰好装了四套工具链。这两个 job 把打包搬进 CI：
  #   * 每个 job 都做"配置 → 构建 → cpack → 解包 → 用包里的 Config 编一个外部工程"；
  #   * 产物用 upload-artifact 留下，可以下载来比对；
  #   * CI 的依赖只有 fetch-deps 能拿到的那几个，所以包名带后缀说明内含：
  #       linux-*-basic  —— 无 ORT/OpenCV（交叉工具链拿不到这两个的 arm 预编译包）
  #       win-x64-msvc-ort —— 有 ORT、无 OpenCV（OpenCV 官方 Windows 包不进 fetch-deps）
  #     带 ORT+OpenCV+ncnn 的"全量包"仍由 scripts/package-all.ps1 在本机生成，
  #     两者命名不同，不会混淆（见 docs/03 §4.4 的对照表）。
  package-linux:
    name: 打包 ${{ matrix.target }}（CPack）
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            triple: arm-linux-gnueabihf
            toolchain: cmake/toolchains/linux-armv7-cross.cmake
          - target: aarch64
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            triple: aarch64-linux-gnu
            toolchain: cmake/toolchains/linux-aarch64-cross.cmake
    steps:
      - uses: actions/checkout@v4
      - name: 安装交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-linux-${{ hashFiles('scripts/fetch-deps.sh', 'scripts/fetch-deps.ps1', 'resources/README.md') }}
          restore-keys: deps-linux-
      - run: bash scripts/fetch-deps.sh
      - name: 从 sysroot 里读出 glibc 版本做包名后缀
        run: |
          set -euo pipefail
          v=$(ls /usr/${{ matrix.triple }}/lib/libc-*.so | head -1 | grep -oE '[0-9]+\.[0-9]+$' | tr -d '.')
          echo "包名后缀: linux-${{ matrix.target }}-glibc${v}-basic"
          echo "SUFFIX=linux-${{ matrix.target }}-glibc${v}-basic" >> "$GITHUB_ENV"
      - name: Configure（打包配置）
        run: |
          cmake -S . -B build/pkg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
            -DMYLIB_BUILD_EXAMPLES=OFF \
            -DMYLIB_BUILD_TESTS=OFF \
            -DMYLIB_BUILD_TOOLS=OFF \
            -DMYLIB_ENABLE_CV=OFF \
            -DMYLIB_ENABLE_NCNN=OFF \
            -DMYLIB_ENABLE_ONNXRUNTIME=OFF \
            -DMYLIB_PACKAGE_SUFFIX="$SUFFIX"
      - name: Build
        run: cmake --build build/pkg
      - name: Package (CPack)
        run: cpack --config build/pkg/CPackConfig.cmake -B dist
      - name: 解包 → 用包里的 Config 交叉编译外部工程（验证包真的可用）
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkgtest && tar -xzf dist/*.tar.gz -C /tmp/pkgtest
          prefix=$(ls -d /tmp/pkgtest/*/ | head -1)
          test -f "${prefix}lib/cmake/my_cpp_libs/my_cpp_libsConfig.cmake"
          test -f "${prefix}share/licenses/my_cpp_libs/THIRD_PARTY_NOTICES.md"
          grep -q "cxx_std_17" "${prefix}lib/cmake/my_cpp_libs/my_cpp_libsConfig.cmake"
          cmake -S tests/sdk_consumer -B build/consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/consumer
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.target }}-basic
          path: dist/*.tar.gz
          if-no-files-found: error

  package-windows:
    name: 打包 Windows（CPack）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 缓存三方库
        uses: actions/cache@v4
        with:
          path: |
            resources
            third_party
          key: deps-windows-${{ hashFiles('scripts/fetch-deps.ps1') }}
          restore-keys: deps-windows-
      - name: 补齐依赖压缩包
        shell: pwsh
        run: ./scripts/fetch-deps.ps1
      - name: Configure（打包配置：有 ORT、无 OpenCV）
        run: >
          cmake -S . -B build/pkg-msvc -A x64
          -DMYLIB_BUILD_EXAMPLES=OFF
          -DMYLIB_BUILD_TESTS=OFF
          -DMYLIB_BUILD_TOOLS=OFF
          -DMYLIB_ENABLE_CV=OFF
          -DMYLIB_ENABLE_NCNN=OFF
          -DMYLIB_PACKAGE_SUFFIX=win-x64-msvc-ort
      - name: Build
        run: cmake --build build/pkg-msvc --config Release
      - name: Package (CPack)
        run: cpack --config build/pkg-msvc/CPackConfig.cmake -C Release -B dist
      - name: 解包 → MSVC 外部工程编 + 跑
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path dist\*.zip -DestinationPath build\pkgtest -Force
          $prefix = (Get-ChildItem build\pkgtest -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path "$prefix\lib\cmake\my_cpp_libs\my_cpp_libsConfig.cmake")) { throw "包内没有 Config" }
          if (-not (Test-Path "$prefix\share\licenses\my_cpp_libs\THIRD_PARTY_NOTICES.md")) { throw "包内没有许可证" }
          cmake -S tests/sdk_consumer -B build\consumer -A x64 "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build\consumer --config Release
          $env:PATH = "$prefix\bin;$env:PATH"
          $exe = Get-ChildItem build\consumer -Recurse -Filter sdk_consumer.exe | Select-Object -First 1
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "消费方运行失败" }
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-win-x64-ort
          path: dist/*.zip
          if-no-files-found: error
